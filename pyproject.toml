[project]
name = "spectrseqtools"
version = "0.2.1"
description = "SpectrSeqTools is a fully automatic analysis platform for sequencing small RNA molecules including (at least 144) known post-transcriptional modifications measured via LC-MS/MS data."
authors = [
    { name = "Laura Christine Kuehle", email = "laura.kuehle@mpi-dortmund.mpg.de" },
    { name = "Juan Antonio Magalang", email = "juan.magalang@mpi-dortmund.mpg.de" },
    { name = "Moshir Harsh", email = "btemoshir@gmail.com" },
    { name = "Johannes Koester", email = "johannes.koester@uni-due.de" }
]
readme = "README.md"
license = "GPL-3.0-only"
requires-python=">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dependencies = [
    "polars >=1.9.0,<2.0",
    "pulp >=2.3.0,<3.0",
    "ddargparse >=1.0.1,<1.1",
    "typed-argument-parser >=1.10.1,<2.0",
    "altair >=5.4.1,<6.0",
    "pyyaml >=6.0.2,<7.0",
    "loguru >=0.7.2,<0.8",
    "numpy >=2.2.3,<3.0",
    "platformdirs >=4.3.8,<5.0",
    "clr-loader >=0.2.7.post0,<0.3",
    "ms-deisotope >=0.0.60,<0.1",
    "pythonnet >=3.0.5,<4.0",
    "tqdm >=4.67.1,<5.0",
    "scikit-learn >=1.7.2,<2.0",
    "dbscan1d >=0.2.3,<0.3",
]

[project.scripts]
spectrseqtools = "spectrseqtools.cli:main"

[project.urls]
Homepage = "https://github.com/spectrseq/spectrseqtools"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64"]

[tool.pixi.dependencies]
highs = ">=1.14,<2.0"
mono = ">=6.12.0.199,<7"
rust = ">=1.85,<2.0"

[tool.pixi.pypi-dependencies]
spectrseqtools = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.15,<0.16"
pytest = "*"
pyrefly = "*"
maturin = "*"

[tool.pixi.feature.dev.tasks]
format = "ruff format"
lint = "ruff check"
format-rust = "cargo fmt"
lint-rust = "cargo clippy"
test = "pytest"
build = { cmd = "maturin build --out dist", description = "Build wheel into the dist/ directory" }
sbuild = { cmd = "maturin sdist --out dist", description = "Build source package into the dist/ directory" }

[tool.pixi.environments]
dev = {features = ["dev"]}

[tool.pytest.ini_options]
pythonpath = ["src/python"]

[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "spectrseqtools.assets.rust_core"
python-source = "src/python"
