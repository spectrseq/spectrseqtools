on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main

name: publish-or-test-publish

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  UV_LOCK_TIMEOUT: 600

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: 8BitJonny/gh-get-current-pr@4.0.0
        id: pr
        if: github.event_name != 'pull_request'

      - uses: GoogleCloudPlatform/release-please-action@v3
        id: release
        if: github.event_name != 'pull_request'
        with:
          release-type: python
          package-name: spectrseqtools

  publish-or-test-publish:
    name: ${{ github.event_name == 'pull_request' && 'test-publish' || 'publish' }}
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created || github.event_name == 'pull_request'
    permissions:
      id-token: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'pull_request' && 'https://test.pypi.org/p/spectrseqtools' || 'https://pypi.org/p/spectrseqtools' }}
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - run: pixi run sbuild

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name != 'pull_request'

      - name: Publishing to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'pull_request'
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
